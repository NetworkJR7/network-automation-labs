frr version 8.4_git
frr defaults traditional
hostname r1
no ipv6 forwarding
!
interface eth1
 ip address 10.20.12.1/30
exit
!
interface lo
 ip address 1.1.1.1/32
exit
!
router bgp 65001
 bgp router-id 1.1.1.1
 neighbor 10.20.12.2 remote-as 65002
 !
 address-family ipv4 unicast
  network 1.1.1.1/32
  neighbor 10.20.12.2 route-map PERMIT-ALL in
  neighbor 10.20.12.2 route-map PERMIT-ALL out
 exit-address-family
exit
!
route-map PERMIT-ALL permit 10
exit
!
