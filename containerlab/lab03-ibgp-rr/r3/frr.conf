frr defaults traditional
hostname r3
service integrated-vtysh-config
!
interface eth1
 ip address 10.30.23.2/30
!
interface lo
 ip address 3.3.3.3/32
!
router bgp 65001
 bgp router-id 3.3.3.3
 neighbor 10.30.23.1 remote-as 65001
 !
 address-family ipv4 unicast
  network 3.3.3.3/32
  neighbor 10.30.23.1 activate
 exit-address-family
!
line vty
!
