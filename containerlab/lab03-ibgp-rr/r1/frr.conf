frr defaults traditional
hostname r1
service integrated-vtysh-config
!
interface eth1
 ip address 10.30.12.1/30
!
interface lo
 ip address 1.1.1.1/32
!
router bgp 65001
 bgp router-id 1.1.1.1
 neighbor 10.30.12.2 remote-as 65001
 !
 address-family ipv4 unicast
  network 1.1.1.1/32
  neighbor 10.30.12.2 activate
 exit-address-family
!
line vty
!
