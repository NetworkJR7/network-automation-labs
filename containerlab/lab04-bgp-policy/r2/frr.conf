frr defaults traditional
hostname r2
service integrated-vtysh-config
!
interface eth1
 ip address 10.40.12.2/30
!
interface lo
 ip address 2.2.2.2/32
 ip address 203.0.113.2/24
!
router bgp 65002
 bgp router-id 2.2.2.2
 neighbor 10.40.12.1 remote-as 65001
 !
 address-family ipv4 unicast
  network 203.0.113.0/24
  neighbor 10.40.12.1 activate
  neighbor 10.40.12.1 route-map PERMIT-ALL in
  neighbor 10.40.12.1 route-map PERMIT-ALL out
 exit-address-family
!
route-map PERMIT-ALL permit 10
!
line vty
!
