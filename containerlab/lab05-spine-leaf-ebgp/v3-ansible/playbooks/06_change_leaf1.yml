---
- name: Lab 05 v3.9 - Idempotent BGP Configuration Change
  hosts: leaf1
  connection: local
  gather_facts: false

  vars:
    bgp_neighbor: "10.0.11.0"
    bgp_description: "SPINE1-UPLINK"
    desired_line: >-
      neighbor {{ bgp_neighbor }} description {{ bgp_description }}

  tasks:

    - name: Read current FRRouting configuration
      ansible.builtin.command:
        argv:
          - docker
          - exec
          - "{{ container_name }}"
          - vtysh
          - -c
          - show running-config
      register: running_config
      changed_when: false

    - name: Check whether desired description exists
      ansible.builtin.set_fact:
        description_present: >-
          {{
            desired_line in running_config.stdout_lines
            or (' ' ~ desired_line) in running_config.stdout_lines
          }}

    - name: Apply BGP neighbor description if necessary
      ansible.builtin.command:
        argv:
          - docker
          - exec
          - "{{ container_name }}"
          - vtysh
          - -c
          - configure terminal
          - -c
          - router bgp 65101
          - -c
          - "{{ desired_line }}"
      register: change_result
      when: not description_present | bool

    - name: Read configuration after change
      ansible.builtin.command:
        argv:
          - docker
          - exec
          - "{{ container_name }}"
          - vtysh
          - -c
          - show running-config
      register: verification
      changed_when: false

    - name: Verify BGP description
      ansible.builtin.assert:
        that:
          - >-
            desired_line in verification.stdout_lines
            or (' ' ~ desired_line) in verification.stdout_lines
        success_msg: "LEAF1: CONFIGURATION VERIFIED"
        fail_msg: "LEAF1: CONFIGURATION VERIFICATION FAILED"

    - name: Display change status
      ansible.builtin.debug:
        msg: >-
          LEAF1 CHANGE STATUS:
          {{ 'APPLIED' if change_result.changed else 'ALREADY CONFIGURED' }}
